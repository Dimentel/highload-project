<!DOCTYPE html>
<html>
<head>
    <title>Train Model</title>
    <script>
        function startTraining() {
            const numArticles = document.getElementById('num_articles').value;

            fetch('/train/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': '{{ csrf_token }}'
                },
                body: JSON.stringify({
                    num_articles: numArticles
                })
            })
            .then(response => response.json())
            .then(data => {
                document.getElementById('task_id').textContent = data.task_id;
                document.getElementById('status').textContent = 'PENDING';
                document.getElementById('result').innerHTML = '';
                checkStatus(data.task_id);
            });
        }

        function checkStatus(taskId) {
            fetch(`/tasks/${taskId}/status/`)
                .then(response => response.json())
                .then(data => {
                    document.getElementById('status').textContent = data.status;

                    if (data.status === 'PENDING' || data.status === 'STARTED') {
                        setTimeout(() => checkStatus(taskId), 2000);
                    } else if (data.status === 'SUCCESS') {
                        document.getElementById('result').innerHTML =
                            '<p>Model trained successfully!</p>' +
                            '<a href="/">Go to search</a>';
                    } else if (data.status === 'FAILURE') {
                        document.getElementById('result').innerHTML =
                            '<p style="color: red;">Error: ' + data.error + '</p>';
                    }
                });
        }
    </script>
</head>
<body>
    <h1>Train Movie Similarity Model</h1>

    <div>
        <label for="num_articles">Number of articles to train:</label>
        <input type="number" id="num_articles" value="1000" min="100" max="20000">
        <button onclick="startTraining()">Start Training</button>
    </div>

    <div style="margin-top: 20px;">
        <h3>Task Status:</h3>
        <p>Task ID: <span id="task_id">-</span></p>
        <p>Status: <span id="status">-</span></p>
        <div id="result"></div>
    </div>

    <p><a href="/">Back to search</a></p>
</body>
</html>
