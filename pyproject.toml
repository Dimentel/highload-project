[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = [
    "I",      # isort
    "E", "W", # pycodestyle
    "F",      # Pyflakes
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "SIM",    # flake8-simplify
    "A",      # flake8-builtins
    "RET",    # flake8-return
    "PTH",    # flake8-use-pathlib
    "FLY",    # flynt
    "C90",    # mccabe
    "NPY",    # NumPy-specific
    "N",      # pep8-naming
    "RUF",    # Ruff-specific
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402"]
"main/migrations/*" = [
    "RUF012",  # mutable class attributes
    "E402",    # imports not at top
    "I001",    # import ordering
    "UP",      # pyupgrade (может ломать миграции)
]
"review2/settings.py" = ["E402"]
"main/models.py" = ["RUF012"]

[tool.ruff.lint.pycodestyle]
max-doc-length = 105

[tool.codespell]
skip = "*.pyc,*.npz,*.pickle,*.sqlite3,.git,.venv,venv,__pycache__,*.csv"
ignore-words-list = "MAPE"
