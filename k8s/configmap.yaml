apiVersion: v1
kind: ConfigMap
metadata:
  name: hl-project-config
  namespace: hl-project
data:
  # Database
  DB_HOST: "postgres-service"
  DB_PORT: "5432"

  # Django
  DJANGO_SETTINGS_MODULE: "review2.settings"
  DJANGO_DEBUG: "False"
  DJANGO_ALLOWED_HOSTS: "*"

  # Application
  NUM_ARTICLES: "1000"
  PYTHONUNBUFFERED: "1"

  # RabbitMQ
  RABBITMQ_HOST: "rabbitmq-service"
  RABBITMQ_PORT: "5672"
  RABBITMQ_MANAGEMENT_PORT: "15672"

  # Celery
  CELERY_RESULT_BACKEND: "rpc://"
  CELERY_TASK_SERIALIZER: "json"
  CELERY_RESULT_SERIALIZER: "json"
  CELERY_ACCEPT_CONTENT: "json"
  CELERY_TIMEZONE: "UTC"
  CELERY_WORKER_CONCURRENCY: "3"
  CELERY_TASK_TRACK_STARTED: "True"
  CELERY_TASK_ACKS_LATE: "True"
  CELERY_TASK_REJECT_ON_WORKER_LOST: "True"
  CELERY_TASK_RETRY_DELAY: "300"
  CELERY_TASK_MAX_RETRIES: "3"
  TRAIN_MAX_RETRIES: "3"
  TRAIN_RETRY_DELAY: "60"
  SIMILAR_MAX_RETRIES: "2"
  SIMILAR_RETRY_DELAY: "30"
  CELERY_WORKER_PREFETCH_MULTIPLIER: "4"
  CELERY_BROKER_POOL_LIMIT: "10"
  CELERY_BROKER_CONNECTION_TIMEOUT: "30"
  CELERY_BROKER_HEARTBEAT: "10"
  CELERY_BROKER_CONNECTION_RETRY_ON_STARTUP: "True"

  # Queues
  TRAIN_QUEUE: "train_queue"
  SIMILAR_QUEUE: "similar_queue"

  # API
  API_URL: "http://web-service:8000"
  UPDATE_TASK_STATUS_URL: "http://web-service:8000/tasks/status/"

  # Timeouts
  TRAIN_TIMEOUT: "300"
  SIMILAR_TIMEOUT: "60"

  # Static files
  STATIC_URL: "/static/"
  STATIC_ROOT: "/app/staticfiles"
  STATICFILES_STORAGE: "whitenoise.storage.CompressedManifestStaticFilesStorage"

  # Gunicorn
  GUNICORN_WORKERS: "3"
  GUNICORN_TIMEOUT: "120"
