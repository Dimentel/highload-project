apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: hl-project
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      imagePullSecrets:
        - name: registrysecret
      initContainers:
        - name: collectstatic
          image: registry.gitlab.akhcheck.ru/dmitrii.boldyrev/highload-project/hl-project:v1.0.1
          command: ["python", "manage.py", "collectstatic", "--noinput"]
          envFrom:
            - configMapRef:
                name: hl-project-config
            - secretRef:
                name: hl-project-secrets
          volumeMounts:
            - name: static-storage
              mountPath: /staticfiles
      containers:
        - name: web
          image: registry.gitlab.akhcheck.ru/dmitrii.boldyrev/highload-project/hl-project:v1.0.0
          command:
            - sh
            - -c
            - |
              echo 'Waiting for PostgreSQL...' &&
              while ! nc -z postgres-service 5432; do sleep 1; done &&
              echo 'Waiting for RabbitMQ...' &&
              while ! nc -z rabbitmq-service 5672; do
                echo waiting for rabbitmq;
                sleep 2;
              done &&
              echo 'RabbitMQ started' &&
              gunicorn review2.wsgi:application \
                --bind 0.0.0.0:8000 \
                --workers 3 \
                --timeout 300 \
                --graceful-timeout 60 \
                --keep-alive 75 \
                --worker-connections 1000
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
          env:
            - name: DATABASE_URL
              value: "postgresql://$(DB_USER):$(DB_PASS)@$(DB_HOST):$(DB_PORT)/$(DB_NAME)"
            - name: CELERY_BROKER_URL
              value: "amqp://$(RABBITMQ_USER):$(RABBITMQ_PASSWORD)@$(RABBITMQ_HOST):$(RABBITMQ_PORT)"
          envFrom:
            - configMapRef:
                name: hl-project-config
            - secretRef:
                name: hl-project-secrets
          ports:
            - containerPort: 8000
          volumeMounts:
            - name: static-storage
              mountPath: /staticfiles
          readinessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
      volumes:
        - name: static-storage
          persistentVolumeClaim:
            claimName: static-pvc
